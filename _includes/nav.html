<nav id="mainNav" class="navbar navbar-default navbar-fixed-top">
 
    <!-- Random coordinates ticker (centre of the bar) -->
    <div class="nav-coords" id="navCoords" aria-hidden="true"></div>
 
    <style>
        /* Hidden on small screens so it can't collide with the logo and menu */
        #mainNav .nav-coords {
            display: none;
        }
        @media (min-width: 1200px) {
            #mainNav .nav-coords {
                display: block;
                position: absolute;
                left: 50%;
                top: 0;
                transform: translateX(-50%);
                line-height: 50px;
                font-family: Consolas, "SFMono-Regular", Menlo, "Liberation Mono", monospace;
                font-size: 15px;
                letter-spacing: 1px;
                white-space: nowrap;
                color: rgba(255, 255, 255, 0.7);   /* over the photo */
                pointer-events: none;
                transition: color 0.3s;
            }
            #mainNav.affix .nav-coords {
                color: #222;                        /* on the white scrolled bar */
            }
        }
    </style>
 
    <script>
    (function () {
        var el = document.getElementById('navCoords');
        if (!el) return;
 
        var RATE_HZ = 3;                 // updates per second
        var RANDOMIZE_DEGREES = true;    // true: every number is random
        var BASE_LAT = 52;               // used only when the flag above is false
        var BASE_LON = 17;
 
        function rnd(max) { return Math.floor(Math.random() * max); }
        function two(n) { return (n < 10 ? '0' : '') + n; }
 
        // one coordinate part, e.g. 52°28'49.2"
        function part(deg) {
            var m = rnd(60);
            var s = (Math.random() * 60).toFixed(1);
            if (parseFloat(s) >= 60) { s = '59.9'; }
            if (parseFloat(s) < 10) { s = '0' + s; }
            return deg + '\u00B0' + two(m) + "'" + s + '"';
        }
 
        function tick() {
            var lat = RANDOMIZE_DEGREES ? rnd(90) : BASE_LAT;
            var lon = RANDOMIZE_DEGREES ? rnd(180) : BASE_LON;
            el.textContent = part(lat) + 'N ' + part(lon) + 'E';
        }
 
        tick();
 
        // Respect "reduce motion": show one value and don't animate
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            return;
        }
        setInterval(tick, 1000 / RATE_HZ);
    })();
    </script>
